# CV content. Every fact here is about the person; the look lives in template.typ.
# Text is printed as written. Wrap words in *stars* to make them bold.
# The full format is in the cv-engine skill's reference/content-format.md.

lang: en          # en, fr, ... sets hyphenation and quotation marks
paper: a4         # a4 or us-letter
max_pages: 1      # the build warns when the CV runs longer

name: Sam Example
